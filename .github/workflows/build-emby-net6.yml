name: Build Emby JavScraper (net6)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/emby-modernize-build

permissions:
  contents: write

jobs:
  build-emby-net6:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate Version
        id: version
        run: |
          echo "version=$(date -u '+%Y.%-m%d.%-H%M.0')" >> "$GITHUB_OUTPUT"

      - name: Build plugin (Release)
        run: |
          dotnet build Emby.Plugins.JavScraper/Emby.Plugins.JavScraper.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.version }}

      - name: Prepare outputs
        run: |
          mkdir -p dist
          # Prefer zipped package generated by csproj target
          ZIP_FILE=$(ls Emby.Plugins.JavScraper/bin/Emby.JavScraper@v*.zip 2>/dev/null | tail -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            cp "$ZIP_FILE" dist/
          fi
          DLL_FILE=$(ls Emby.Plugins.JavScraper/bin/Release*/JavScraper.dll 2>/dev/null | tail -n 1 || true)
          if [ -n "$DLL_FILE" ]; then
            cp "$DLL_FILE" dist/JavScraper.dll
          fi
          ls -lah dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Emby-JavScraper-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: emby-javscraper-v${{ steps.version.outputs.version }}
          name: Emby JavScraper v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
